name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit and integration tests
        run: npm test

  macos:
    name: macOS scripts and build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bash syntax
        run: |
          find macos scripts -type f \( -name '*.sh' -o -name 'install.command' \) -print0 \
            | xargs -0 -n1 bash -n
      - name: Unit and integration tests
        run: npm test
      - name: Build macOS artifacts
        run: bash scripts/build-macos.sh
      - name: Installer smoke test (no MITM)
        env:
          DEEPSEEK_API_KEY: test-key
        run: |
          SMOKE_HOME="$RUNNER_TEMP/qclaude-home"
          SMOKE_DIR="$SMOKE_HOME/Library/Application Support/QClaudeCode"
          mkdir -p "$SMOKE_HOME"
          HOME="$SMOKE_HOME" bash macos/install.sh \
            --provider deepseek \
            --skip-desktop \
            --skip-claude-code \
            --no-start \
            --install-dir "$SMOKE_DIR"
          test -f "$SMOKE_DIR/gateway/config.json"
          test -f "$SMOKE_DIR/env"
          test -f "$SMOKE_HOME/Library/LaunchAgents/com.qclaude.gateway.plist"
          HOME="$SMOKE_HOME" bash macos/uninstall.sh \
            --keep-settings \
            --no-mitm-cleanup \
            --install-dir "$SMOKE_DIR"
          test ! -d "$SMOKE_DIR"

  validate:
    name: Scripts and JSON
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate repository
        shell: pwsh
        run: ./scripts/verify-repo.ps1 -SkipTests
