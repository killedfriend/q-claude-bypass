name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: npm test

      - name: Build release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/build-release.ps1 -Version $version -Repo $env:GITHUB_REPOSITORY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qclaude-code.zip
            dist/qclaude-code-*.zip
            dist/install.ps1
            dist/install.cmd
            dist/uninstall.ps1
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Educational, non-commercial project. Provided as-is, without warranty.
            Not affiliated with Anthropic, DeepSeek, Tencent, Alibaba or OpenRouter.

            Install on Windows:

            ```powershell
            irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
            ```

            See README.ru.md, README.en.md and README.zh-CN.md.
