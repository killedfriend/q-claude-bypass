name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build Windows assets
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Tests
        run: npm test

      - name: Build release assets
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          ./scripts/build-release.ps1 -Version $version -Repo $env:GITHUB_REPOSITORY

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/qclaude-code.zip
            dist/qclaude-code-*.zip
            dist/install.ps1
            dist/install.cmd
            dist/uninstall.ps1
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            Educational, non-commercial project. Provided as-is, without warranty.
            Not affiliated with Anthropic, DeepSeek, Tencent, Alibaba or OpenRouter.

            Install on Windows:

            ```powershell
            irm https://github.com/${{ github.repository }}/releases/latest/download/install.ps1 | iex
            ```

            See README.ru.md, README.en.md and README.zh-CN.md.

            macOS assets are built on the macOS runner: use the `.zip` package or
            the unsigned `.pkg`; see docs/*/macos.md.

  release-macos:
    name: Build macOS assets
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests
        run: npm test
      - name: Build macOS artifacts
        run: bash scripts/build-macos.sh
      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/macos/*.zip \
            dist/macos/*.pkg \
            dist/macos/SHA256SUMS-macos.txt \
            --clobber
